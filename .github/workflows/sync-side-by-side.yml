name: sync side by side and scale repaint
on:
  push:
    paths:
      - .github/workflows/sync-side-by-side.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply side-by-side layout and scale repaint
        run: |
          python3 - << 'PY'
          import base64, subprocess
          from pathlib import Path
          patch = base64.b64decode("""""")
          Path("sync.patch").write_bytes(patch)
          subprocess.check_call(["git", "apply", "sync.patch"])
          expected = {
              "Logic.lua": "68b75e8749dbc5640dac6e552606dd7ac9d92022",
              "LooseButtons.lua": "dd0fb4b9823d9ece3237b0af5cd55a839dca99c5",
              "CHANGELOG.md": "7f20f2fedd366106cb073174c1288387752dd8ae",
          }
          for path, sha in expected.items():
              got = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if got != sha:
                  raise SystemExit(f"{path} blob {got} != {sha}")
          Path("sync.patch").unlink()
          PY
          git config user.name "Eric R"
          git config user.email "31020921+zale00@users.noreply.github.com"
          git add Logic.lua LooseButtons.lua CHANGELOG.md
          git rm -f .github/workflows/sync-side-by-side.yml
          git commit -F - << 'MSG'
          feat(loosebuttons): place Scale and Theme on one row and repaint on scale

          Scale and Theme were two rows under the Character & info title. They now share one row, with Theme to the right of Scale. A checked box shows that column's slider or dropdown. The other checkbox stays where it is, because each column keeps the width of its control.

          Logic.SectionRow returns the 97 pixel height and the six anchors. ShowSectionScale applies that record. Checkbox clicks still only call SetShown. SectionThemeOffset, SectionControlReach, and SectionSliderNudge are gone.

          Changing scale calls RepaintPlaced after the resize, so the hover highlight matches the new button size instead of hanging below it. ApplyLauncherScale still goes through ApplyScale. Hidden buttons stay unpainted until they are shown. Combat still defers the resize.

          Spell headers stay 51. Backpack stays on the strip scale and theme.
          MSG
          git push origin HEAD:main
