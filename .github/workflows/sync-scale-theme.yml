name: sync scale theme
on:
  push:
    paths:
      - .github/workflows/sync-scale-theme.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Scale and Theme layout
        run: |
          python3 - << 'PY'
          import subprocess
          from pathlib import Path

          def swap(path, old, new):
              file = Path(path)
              body = file.read_text()
              count = body.count(old)
              if count != 1:
                  raise SystemExit(f"{path} pattern count {count}")
              file.write_text(body.replace(old, new, 1))

          swap("Logic.lua", "\ttitleGap = 6,\n", "")
          swap(
              "Logic.lua",
              "\tsliderNudge = 4,\n\tband = 14,\n",
              "\tsliderNudge = 4,\n\tsliderCap = 9,\n\ttitleLine = 22,\n\tband = 14,\n",
          )
          swap(
              "Logic.lua",
              "\tlocal cluster = stack.check + stack.stackGap + stack.check\n",
              "\tlocal cluster = stack.titleLine + stack.sliderCap + stack.check + stack.stackGap + stack.check\n",
          )
          swap(
              "Logic.lua",
              "function Logic.SectionControlReach(titleW, scaleLabelW, themeLabelW)\n"
              "\tlocal stack = Logic.SECTION_STACK\n"
              "\tlocal scaleLeft = titleW + stack.titleGap\n"
              "\tlocal themeRight = scaleLeft + stack.check + stack.labelGap + themeLabelW + stack.controlGap + stack.dropW\n"
              "\tlocal besideRight = scaleLeft + stack.check + stack.labelGap + scaleLabelW + stack.controlGap + stack.sliderW + stack.controlGap + stack.check + stack.labelGap + themeLabelW + stack.controlGap + stack.dropW\n"
              "\treturn themeRight, besideRight\n",
              "function Logic.SectionControlReach(scaleLabelW, themeLabelW)\n"
              "\tlocal stack = Logic.SECTION_STACK\n"
              "\tlocal themeRow = stack.check + stack.labelGap + themeLabelW + stack.controlGap + stack.dropW\n"
              "\tlocal scaleRow = stack.check + stack.labelGap + scaleLabelW + stack.controlGap + stack.sliderW\n"
              "\treturn themeRow, scaleRow\n",
          )
          swap(
              "LooseButtons.lua",
              '\theader.check:SetPoint("TOPLEFT", header.text, "TOPRIGHT", stack.titleGap, 0)\n',
              '\theader.check:SetPoint("TOPLEFT", header.text, "BOTTOMLEFT", 0, -stack.sliderCap)\n',
          )
          changelog = Path("CHANGELOG.md")
          bullet = (
              "- Scale and Theme sit under the Character & info title, lined up with its left edge. "
              "Scale is the first row. Theme is the next. Checking a box shows that row's slider or dropdown to the right.\n"
          )
          header = "## 0.1.0\n\n"
          text = changelog.read_text()
          if header not in text:
              raise SystemExit("changelog header missing")
          changelog.write_text(text.replace(header, header + bullet, 1))

          expected = {
              "Logic.lua": "842b043fc6ef6ef538deff1360c2e2fd9b0fd07d",
              "LooseButtons.lua": "06f75551bcff53aecefb07369aadcfcabe5e3b8e",
              "CHANGELOG.md": "3496723b67cdcbd98be09e1609b4ebebaea3d2de",
          }
          for path, sha in expected.items():
              got = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if got != sha:
                  raise SystemExit(f"{path} blob {got} != {sha}")
          PY
          git config user.name "Eric R"
          git config user.email "31020921+zale00@users.noreply.github.com"
          git add Logic.lua LooseButtons.lua CHANGELOG.md
          git rm -f .github/workflows/sync-scale-theme.yml
          git commit -F - << 'MSG'
          feat(loosebuttons): stack Scale and Theme under the title

          The Scale checkbox hung off the right edge of "Character & info", so the slider and the theme dropdown shared the space beside the title. Both rows now start at the title's left. Scale is the first row. Theme stays one checkbox below it. A checked box still shows that row's control to the right.

          The header grows from 93 to 124 so the title line and the slider overhang sit above the two checkboxes. The 14px band above the title still matches the band above the divider. Spell headers stay 51.
          MSG
          git push origin HEAD:main
