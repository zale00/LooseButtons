name: sync-loosebuttons
on:
  push:
    paths:
      - .github/workflows/sync-loosebuttons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Character info and share dialog source
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2" page="$3" sum="$4"
            curl -fsSL -A "Mozilla/5.0" -o "$out" "$url" || true
            if ! echo "$sum  $out" | sha256sum -c -; then
              local fresh
              fresh=$(curl -fsSL -A "Mozilla/5.0" "$page" | grep -oE 'https://tmpfiles.org/dl/[^"]+' | head -1)
              curl -fsSL -A "Mozilla/5.0" -o "$out" "$fresh"
              echo "$sum  $out" | sha256sum -c -
            fi
          }
          fetch \
            "https://tmpfiles.org/dl/1790524946.54b8605fb791555c/wDwkp4F2bMYA/logic.lua" \
            Logic.lua \
            "https://tmpfiles.org/wDwkp4F2bMYA/logic.lua" \
            "7d135815d2bb87f5a30cbda00b2b5daa7c7ea5154b50d69838b4271b9d1b5f7c"
          fetch \
            "https://tmpfiles.org/dl/1790524946.139fb5b9d8a714ee/wAwxpVFObG1o/loosebuttons.lua" \
            LooseButtons.lua \
            "https://tmpfiles.org/wAwxpVFObG1o/loosebuttons.lua" \
            "4e86e89c497f80b8f195cfc8404fef642bc0a45f62abf17ae2005edc98f70cb3"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text()
          entries = [
              "- Share and Import dialogs grow to fit their controls, and Share copies the layout string with Copy to Clipboard.\n",
              "- Character & info stacks Scale above Theme so the dropdown stays on the parchment, and No plate glows inside the icon instead of an outer frame.\n",
          ]
          needle = "## 0.1.0\n\n"
          missing = [entry for entry in entries if entry not in text]
          if missing:
              if needle not in text:
                  raise SystemExit("unexpected changelog")
              p.write_text(text.replace(needle, needle + "".join(missing), 1))
          PY
          rm -f .github/workflows/sync-loosebuttons.yml
          git config user.name "Eric R"
          git config user.email "31020921+zale00@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          fix(loosebuttons): stack Character info, glow No plate, and fit share dialogs

          Character & info stacks Scale above Theme so the Theme dropdown stays on the parchment. No plate glows inside the icon instead of an outer frame.

          Share and Import grow to fit their controls. Share copies the layout string with Copy to Clipboard.
          EOF
          )"
          for _ in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
